version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: novamarquet_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=novamarquet
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=securepassword123
    restart: always
    expose:
      - "5432"

  # 2. Django REST Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novamarquet_backend
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    environment:
      - DB_NAME=novamarquet
      - DB_USER=postgres
      - DB_PASSWORD=securepassword123
      - DB_HOST=db
      - DB_PORT=5432
      # Secret API gateways parameters (Set actual keys in production env)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_SECRET=${PAYPAL_SECRET:-}
    depends_on:
      - db
    restart: always
    expose:
      - "8000"

  # 3. React Vite Frontend UI Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novamarquet_frontend
    restart: always
    expose:
      - "80"

  # 4. Main Gateway Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: novamarquet_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_media:/usr/share/nginx/media:ro
      - backend_static:/usr/share/nginx/static:ro
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  postgres_data:
  backend_media:
  backend_static:
