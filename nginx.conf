user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression for high speed performance
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Targets
    upstream django_backend {
        server backend:8000;
    }

    upstream react_frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Forward Django API endpoints
        location /api/ {
            proxy_pass http://django_backend;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
            client_max_body_size 20M;
        }

        # 2. Forward Django Admin panel
        location /admin/ {
            proxy_pass http://django_backend;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
            client_max_body_size 20M;
        }

        # 3. Serve Django uploaded media files directly (Photos)
        location /media/ {
            alias /usr/share/nginx/media/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
        }

        # 4. Serve Django Admin panels static files
        location /static/ {
            alias /usr/share/nginx/static/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
        }

        # 5. Route root to React client
        location / {
            proxy_pass http://react_frontend;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
    }
}
